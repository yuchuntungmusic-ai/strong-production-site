function formatDate(d) {
  const dt = new Date(d);
  return dt.getFullYear() + "年" + (dt.getMonth() + 1) + "月" + dt.getDate() + "日";
}

function renderPosts(filter) {
  const grid = document.getElementById("blogGrid");
  const sorted = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
  const filtered = filter === "all" ? sorted : sorted.filter(p => p.cat === filter);

  let html = filtered.map(p => `
    <a href="${p.url}" class="post-card">
      <div class="post-thumb">
        <img src="${p.img}" alt="${p.imgAlt}" loading="lazy" width="400" height="180">
      </div>
      <div class="post-body">
        <div class="post-cat-tag">${p.catIcon} ${p.cat}</div>
        <h2>${p.title}</h2>
        <p>${p.excerpt}</p>
        <div class="post-footer">
          <span>📅 ${formatDate(p.date)}</span>
          <span class="read-more">閱讀更多 →</span>
        </div>
      </div>
    </a>
  `).join("");

  if (filtered.length === 0) {
    html = `<div class="coming-soon" style="grid-column:1/-1"><div style="font-size:2rem">🔍</div><p><strong>暫時未有此分類文章</strong><br>敬請期待，即將發佈</p></div>`;
  }

  html += `
    <div class="coming-soon">
      <div style="font-size:2rem">✍️</div>
      <p><strong>更多文章即將發佈</strong><br>關注我們，第一時間獲取<br>品牌營銷最新洞察</p>
    </div>
  `;

  grid.innerHTML = html;
}

document.querySelectorAll(".topic-tag").forEach(btn => {

    document.querySelectorAll(".topic-tag").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderPosts(btn.dataset.filter);
  });
});
